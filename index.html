<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CENTRAL O.I.M.C.</title>
    <style>
        /* Estilo base y fondo oscuro */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a252f; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Pantalla de Inicio de Sesión */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 15px; color: #333; width: 280px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo-oimc { color: #e74c3c; font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        
        /* Cabecera del Sistema */
        .header { background: #e74c3c; height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-salir { background: #333; color: white; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 0.8rem; }
        
        /* Contenedor del Chat (se verá tras el PIN) */
        #chat-window { flex-grow: 1; width: 100%; background: white; display: none; }
        #chatra-inline-container { width: 100%; height: 100%; }

        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button.login-btn { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <div class="logo-oimc">O.I.M.C.</div>
        <p style="margin-bottom:15px; font-weight:bold; color:#7f8c8d;">CONTROL DE ACCESO</p>
        <input type="text" id="user-input" placeholder="Nombre de Agente">
        <input type="password" id="pin-input" placeholder="PIN">
        <button class="login-btn" onclick="verificar()">ACCEDER A LA CENTRAL</button>
    </div>
</div>

<div class="header">
    <span style="font-weight:bold;">SISTEMA CENTRAL O.I.M.C.</span>
    <button class="btn-salir" onclick="location.reload()">CERRAR SESIÓN</button>
</div>

<div id="chat-window">
    <div id="chatra-inline-container"></div>
</div>

<script>
    (function(d, w, c) {
        w.ChatraID = 'EsD9gG3HjqNjsdDCN';
        var s = d.createElement('script');
        w[c] = w[c] || function() {
            (w[c].q = w[c].q || []).push(arguments);
        };
        s.async = true;
        s.src = 'https://call.chatra.io/chatra.js';
        if (d.head) d.head.appendChild(s);
    })(document, window, 'Chatra');

    // Configuración para que el chat aparezca dentro de la página, no como burbuja
    window.ChatraSetup = {
        mode: 'inline',
        container: '#chatra-inline-container'
    };
</script>

<script>
    const usuarios = { 
        "juan": "2313", "iñaki": "1010", "asier": "2020", "amets": "4040", 
        "erika": "5050", "nahia": "6060", "gaizka": "7070", "mikel": "8080", 
        "yolanda": "9090", "jesús": "1365" 
    };

    function verificar() {
        const uRaw = document.getElementById('user-input').value.trim();
        const uLower = uRaw.toLowerCase();
        const p = document.getElementById('pin-input').value.trim();

        if (usuarios[uLower] === p) {
            // Ocultar login y mostrar chat
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('chat-window').style.display = 'block';
            
            // Pasar el nombre del agente al chat automáticamente
            if (window.Chatra) {
                Chatra('updateIntegrationData', {
                    name: uRaw,
                    notes: 'Acceso verificado vía PIN'
                });
                Chatra('show');
            }
        } else {
            alert("Acceso Denegado: Usuario o PIN incorrecto.");
        }
    }
</script>

</body>
</html>
