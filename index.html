<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Jaso-O.I.M.C. - Diario Oficial</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
        .noticia { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #e74c3c; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        img { max-width: 100%; border-radius: 5px; margin-top: 10px; }
        small { color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="header"><h1>JASO-O.I.M.C.</h1><p>COMUNICADOS OFICIALES</p></div>
    <div id="noticias">Cargando noticias...</div>

    <script>
        // --- CONFIGURACIÓN ---
        const LINK_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJDhYRb1tgHja5_oy-Eag_50BrQ2Lwh2WJPKrzQWXOgOOnQANRtirDMoicC0bmAVRDbS1gFzKQ_mNO/pub?output=csv";

        async function leerNoticias() {
            try {
                const respuesta = await fetch(LINK_CSV);
                const texto = await respuesta.text();
                const filas = texto.split('\n').slice(1); // Ignora la fila de títulos
                
                let htmlFinal = "";
                filas.forEach(fila => {
                    const columnas = fila.split(',');
                    if(columnas.length >= 2) {
                        htmlFinal += `
                            <div class="noticia">
                                <small>${columnas[2] || ''}</small>
                                <h2>${columnas[0]}</h2>
                                <p>${columnas[1]}</p>
                                ${columnas[3] ? `<img src="${columnas[3]}">` : ''}
                            </div>
                        `;
                    }
                });
                document.getElementById('noticias').innerHTML = htmlFinal || "No hay noticias hoy.";
            } catch (error) {
                document.getElementById('noticias').innerHTML = "Error al conectar con la base de datos.";
            }
        }
        leerNoticias();
    </script>
</body>
</html>
