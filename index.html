<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENTRAL O.I.M.C.</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a252f; color: white; text-align: center; height: 100vh; overflow: hidden; }
        
        /* PANTALLA DE ACCESO */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 35px; border-radius: 20px; color: #333; width: 280px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        
        .header { background: #e74c3c; height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .btn-banco { background: #f1c40f; color: #2c3e50; padding: 5px 12px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
        
        /* EL DOCUMENTO DE GOOGLE */
        #doc-container { height: calc(100vh - 50px); width: 100%; background: white; }
        iframe { width: 100%; height: 100%; border: none; }

        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2 style="color:#e74c3c; margin:0;">O.I.M.C.</h2>
        <p>Introduce tu PIN oficial</p>
        <input type="text" id="user-input" placeholder="Tu Nombre">
        <input type="password" id="pin-input" placeholder="Tu PIN">
        <button onclick="verificar()">ACCEDER AL SISTEMA</button>
    </div>
</div>

<div class="header">
    <span style="font-weight: bold;">CENTRAL DE DATOS O.I.M.C.</span>
    <a href="https://banco-oimc-h47hsdjbghr7jq3thguvva.streamlit.app" target="_blank" class="btn-banco">🏦 BANCO</a>
</div>

<div id="doc-container">
    <iframe src="" id="google-doc-frame"></iframe>
</div>

<script>
    const usuarios = { 
        "juan": "2313", "iñaki": "1010", "asier": "2020", "amets": "4040", 
        "erika": "5050", "nahia": "6060", "gaizka": "7070", "mikel": "8080", 
        "yolanda": "9090", "jesús": "1365" 
    };

    function verificar() {
        const u = document.getElementById('user-input').value.toLowerCase().trim();
        const p = document.getElementById('pin-input').value.trim();

        if (usuarios[u] === p) {
            // PEGA AQUÍ TU ENLACE DE GOOGLE DOC ENTRE LAS COMILLAS
            const miDocUrl = "https://docs.google.com/document/d/1i8r9ZUgGe-1zr-Fyq9SxXcKAnsyOPhRaN3Tc7rJKjLw/edit?usp=sharing"; 
            
            document.getElementById('google-doc-frame').src = miDocUrl;
            document.getElementById('login-overlay').style.display = 'none';
        } else {
            alert("Acceso Denegado");
        }
    }
</script>

</body>
</html>
