<script>
    // URL DE LA NUBE PARA JASO-O.I.M.C.
    const CLOUD_URL = "https://kvdb.io/6E9C9U8v5F8u8L9Y9xZ7j9/noticias_jaso_oimc";
    let tempImageData = null;
    const usersDB = { "juan": "2313", "iñaki": "1010", "asier": "2020", "amets": "4040", "erika": "5050", "nahia": "6060", "gaizka": "7070", "mikel": "8080", "yolanda": "9090", "jesús": "1365" };

    // ... (El resto del código de login y paste se mantiene igual) ...

    async function loadNews() {
        const feed = document.getElementById('news-feed');
        const admin = document.getElementById('admin-news-list');
        
        try {
            const res = await fetch(CLOUD_URL);
            if (!res.ok) throw new Error("Vacío");
            const history = await res.json();
            
            if (!Array.isArray(history)) { render([]); return; }
            render(history);
        } catch (e) {
            console.log("Iniciando base de datos nueva...");
            render([]); // Muestra "No hay noticias" en lugar de quedarse pillado
        }
    }

    async function saveNews() {
        const t = document.getElementById('news-title').value;
        const b = document.getElementById('news-body').value;
        const btn = document.getElementById('publish-btn');
        if(!t || !b) return alert("Faltan datos");

        btn.innerText = "CONECTANDO CON LA NUBE...";
        btn.disabled = true;

        let history = [];
        try {
            const res = await fetch(CLOUD_URL);
            if (res.ok) {
                history = await res.json();
            }
        } catch(e) { history = []; }

        // Añadimos la nueva noticia
        const newNews = { 
            id: Date.now(), 
            title: t, 
            body: b, 
            image: tempImageData, 
            date: new Date().toLocaleString() 
        };
        
        history = Array.isArray(history) ? history : [];
        history.unshift(newNews);

        try {
            // Guardar en la nube (POST)
            const saveRes = await fetch(CLOUD_URL, { 
                method: 'POST', 
                body: JSON.stringify(history) 
            });

            if(saveRes.ok) {
                document.getElementById('news-title').value = "";
                document.getElementById('news-body').value = "";
                tempImageData = null;
                document.getElementById('image-preview').innerHTML = "Pega imagen (Ctrl+V)";
                
                alert("¡Publicado con éxito en la nube Jaso-O.I.M.C.!");
                
                await loadNews(); // Forzar recarga visual
                openTab('tab-ver', document.querySelectorAll('.tab-btn')[1]);
            } else {
                throw new Error("Error al guardar");
            }
        } catch (e) { 
            alert("Error de red: No se pudo subir a la nube."); 
        } finally {
            btn.innerText = "PUBLICAR PARA TODOS";
            btn.disabled = false;
        }
    }

    // Asegúrate de que la función render sea esta:
    function render(history) {
        const feed = document.getElementById('news-feed');
        const admin = document.getElementById('admin-news-list');
        
        if (!history || history.length === 0) {
            feed.innerHTML = "<p style='text-align:center; color:gray;'>No hay comunicados oficiales en la red global.</p>";
            admin.innerHTML = "<p>Esperando primera publicación...</p>";
            return;
        }

        feed.innerHTML = history.map(n => `
            <div class="news-item">
                <small style="color:#e74c3c; font-weight:bold;">${n.date}</small>
                <h3>${n.title}</h3>
                <p>${n.body.replace(/\n/g, '<br>')}</p>
                ${n.image ? `<img src="${n.image}" class="news-img">` : ''}
            </div>
        `).join('');

        admin.innerHTML = history.map(n => `
            <div class="news-item" style="border-left-color: #27ae60; padding:10px;">
                <strong>${n.title}</strong><br>
                <button class="btn-delete" onclick="deleteNews(${n.id})">ELIMINAR GLOBALMENTE</button>
            </div>
        `).join('');
    }
</script>
