<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicaciones-O.I.M.C.</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a252f; color: white; text-align: center; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: white; padding: 30px; border-radius: 15px; color: #333; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { background: #e74c3c; padding: 20px; font-weight: bold; font-size: 1.5rem; }
        .nav { background: #34495e; padding: 10px; }
        .btn-banco { background: #f1c40f; color: #2c3e50; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .chat-container { padding: 20px; max-width: 500px; margin: auto; height: 550px; }
        iframe { border-radius: 10px; background: white; border: none; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        button.login-btn { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2 style="margin-top:0;">O.I.M.C.</h2>
        <p>Identificación Requerida</p>
        <input type="text" id="user-input" placeholder="Tu Nombre">
        <input type="password" id="pin-input" placeholder="Tu PIN">
        <button class="login-btn" onclick="verificarAcceso()">ENTRAR AL CHAT</button>
    </div>
</div>

<div class="header">SISTEMA O.I.M.C.</div>

<div class="nav">
    <a href="https://banco-oimc-h47hsdjbghr7jq3thguvva.streamlit.app" target="_blank" class="btn-banco">🏦 IR AL BANCO CENTRAL</a>
</div>

<div class="chat-container">
    <h3>Chat Grupal</h3>
    <iframe src="https://www.minichat.com/chat/oimc_global_chat" width="100%" height="500"></iframe>
</div>

<script>
    // Tu tabla de usuarios según la foto
    const usuariosPermitidos = { 
        "juan": "2313", "iñaki": "1010", "asier": "2020", "amets": "4040", 
        "erika": "5050", "nahia": "6060", "gaizka": "7070", "mikel": "8080", 
        "yolanda": "9090", "jesús": "1365" 
    };

    function verificarAcceso() {
        const user = document.getElementById('user-input').value.toLowerCase().trim();
        const pin = document.getElementById('pin-input').value.trim();

        if (usuariosPermitidos[user] === pin) {
            document.getElementById('login-overlay').style.display = 'none';
        } else {
            alert("Error: PIN o Usuario incorrecto.");
        }
    }
</script>

</body>
</html>
