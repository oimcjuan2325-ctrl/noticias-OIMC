<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias JasoOIMC - Portal Oficial</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e9ebee; color: #1a1a1a; }
        
        /* Pantalla de Login */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* Cabecera */
        .masthead { background: #2c3e50; color: white; padding: 20px; text-align: center; border-bottom: 5px solid #e74c3c; }
        
        /* Navegación por Pestañas */
        .nav-tabs { display: none; justify-content: center; background: #34495e; position: sticky; top: 0; z-index: 100; }
        .tab-btn { padding: 15px 20px; cursor: pointer; color: white; border: none; background: none; font-weight: bold; transition: 0.3s; font-size: 0.9rem; }
        .tab-btn:hover { background: #4e6a85; }
        .tab-btn.active { background: #e74c3c; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .tab-content { display: none; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-height: 300px; }
        .tab-content.active { display: block; }

        /* Estilos de Noticias */
        .news-item { padding: 15px; border-left: 5px solid #e74c3c; background: #f8f9fa; margin-bottom: 15px; border-radius: 4px; }
        
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn-main { background: #e74c3c; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        
        .banco-link-card { text-align: center; padding: 40px; border: 2px dashed #3498db; border-radius: 10px; }
        .btn-banco { display: inline-block; background: #3498db; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2 style="margin-top:0; color:#2c3e50;">O.I.M.C.</h2>
        <p>Inicie sesión para acceder al portal</p>
        <input type="text" id="user-input" placeholder="Usuario">
        <input type="password" id="pass-input" placeholder="PIN de Seguridad">
        <button onclick="checkLogin()" class="btn-main">ENTRAR</button>
    </div>
</div>

<div class="masthead">
    <h1 style="margin:0; font-size: 1.5rem; letter-spacing: 2px;">NOTICIAS JASOOIMC</h1>
</div>

<div id="nav-bar" class="nav-tabs">
    <button class="tab-btn active" onclick="openTab('tab-banco', this)">🏦 BANCO</button>
    <button class="tab-btn" onclick="openTab('tab-ver', this)">📰 NOTICIAS</button>
    <button id="admin-tab-btn" class="tab-btn" onclick="openTab('tab-redactar', this)" style="display: none; color: #2ecc71;">✍️ REDACTAR</button>
</div>

<div class="container">
    <div id="tab-banco" class="tab-content active">
        <div class="banco-link-card">
            <h2 style="color:#2c3e50;">Acceso al Sistema Bancario</h2>
            <p>Para gestionar sus fondos, créditos y cuentas, pulse el botón inferior para ser redirigido a la terminal bancaria oficial.</p>
            <a href="https://oimcjuan2325-ctrl.github.io/Banco-O.I.M.C/" class="btn-banco">IR AL BANCO O.I.M.C.</a>
        </div>
    </div>

    <div id="tab-ver" class="tab-content">
        <h2 style="border-bottom: 2px solid #e74c3c; padding-bottom: 10px;">Comunicados Oficiales</h2>
        <div id="news-feed">
            </div>
    </div>

    <div id="tab-redactar" class="tab-content">
        <h2 style="color:#27ae60;">Nueva Entrada de Mando</h2>
        <input type="text" id="news-title" placeholder="Título de la noticia...">
        <textarea id="news-body" rows="6" placeholder="Escriba el comunicado oficial..."></textarea>
        <button onclick="saveNews()" class="btn-main" style="background:#27ae60;">PUBLICAR Y GUARDAR</button>
    </div>
</div>

<script>
    // BASE DE DATOS DE USUARIOS Y PINS
    const usersDB = {
        "juan": "2313", "iñaki": "1010", "asier": "2020", "amets": "4040",
        "erika": "5050", "nahia": "6060", "gaizka": "7070", "mikel": "8080",
        "yolanda": "9090", "jesús": "1365"
    };

    function checkLogin() {
        const user = document.getElementById('user-input').value.toLowerCase().trim();
        const pass = document.getElementById('pass-input').value.trim();

        if (usersDB[user] && usersDB[user] === pass) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('nav-bar').style.display = 'flex';
            
            // Si es JUAN, activamos la TERCERA SECCIÓN (Redactar)
            if (user === 'juan') {
                document.getElementById('admin-tab-btn').style.display = 'block';
            }
            loadNews();
        } else {
            alert("Credenciales incorrectas. Acceso denegado.");
        }
    }

    function openTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function saveNews() {
        const t = document.getElementById('news-title').value;
        const b = document.getElementById('news-body').value;
        const date = new Date().toLocaleString();

        if (!t || !b) return alert("Rellene los campos");

        const news = { title: t, body: b, date: date };
        let history = JSON.parse(localStorage.getItem('jasooimc_news')) || [];
        history.unshift(news);
        localStorage.setItem('jasooimc_news', JSON.stringify(history));

        document.getElementById('news-title').value = "";
        document.getElementById('news-body').value = "";
        loadNews();
        alert("Noticia guardada permanentemente.");
        openTab('tab-ver', document.querySelectorAll('.tab-btn')[1]);
    }

    function loadNews() {
        const feed = document.getElementById('news-feed');
        const history = JSON.parse(localStorage.getItem('jasooimc_news')) || [];
        
        if (history.length === 0) {
            feed.innerHTML = "<p>No hay noticias todavía.</p>";
            return;
        }

        feed.innerHTML = history.map(n => `
            <div class="news-item">
                <small style="color:#e74c3c; font-weight:bold;">${n.date}</small>
                <h3>${n.title}</h3>
                <p>${n.body.replace(/\n/g, '<br>')}</p>
            </div>
        `).join('');
    }
</script>

</body>
</html>
