<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CENTRAL O.I.M.C.</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a252f; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 20px; color: #333; width: 300px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; }
        .header-logo { color: #e74c3c; font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 10px; }
        button:hover { background: #c0392b; }
        .info { font-size: 0.8rem; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="header-logo">O.I.M.C.</div>
    <p>Acceso a Comunicaciones</p>
    
    <input type="text" id="user-input" placeholder="Tu Nombre">
    <input type="password" id="pin-input" placeholder="PIN de Seguridad">
    
    <button onclick="entrar()">ENTRAR AL CHAT</button>
    
    <div class="info">Sistema de mensajería encriptado</div>
</div>

<script>
    const usuarios = { 
        "juan": "2313", "iñaki": "1010", "asier": "2020", "amets": "4040", 
        "erika": "5050", "nahia": "6060", "gaizka": "7070", "mikel": "8080", 
        "yolanda": "9090", "jesús": "1365" 
    };

    function entrar() {
        const u = document.getElementById('user-input').value.trim();
        const p = document.getElementById('pin-input').value.trim();
        const uLower = u.toLowerCase();

        if (usuarios[uLower] === p) {
            // El truco final: Abrimos una sala de chat que NO se puede bloquear
            // Es una sala ultra-rápida y privada
            const salaUrl = "https://tlk.io/oimc-central";
            
            alert("Acceso concedido. Bienvenido, " + u);
            window.location.href = salaUrl; 
        } else {
            alert("PIN o Usuario incorrecto. Acceso denegado.");
        }
    }
</script>

</body>
</html>
