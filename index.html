<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CENTRAL O.I.M.C.</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a252f; color: white; height: 100vh; overflow: hidden; }
        
        /* LOGIN */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 35px; border-radius: 20px; color: #333; width: 280px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; }
        
        /* CABECERA */
        .header { background: #e74c3c; height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .menu-btns { display: flex; gap: 8px; }
        
        /* BOTONES */
        .btn { padding: 8px 12px; border-radius: 5px; font-weight: bold; font-size: 0.75rem; text-decoration: none; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-banco { background: #f1c40f; color: #2c3e50; }
        .btn-logout { background: #333; color: white; }
        .btn-full { background: #2ecc71; color: white; }
        
        /* CONTENEDOR DOCUMENTO */
        #doc-container { height: calc(100vh - 60px); width: 100%; background: white; }
        iframe { width: 100%; height: 100%; border: none; }

        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button.main-btn { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2 style="color:#e74c3c; margin-top:0;">O.I.M.C.</h2>
        <p>Introduce tus credenciales</p>
        <input type="text" id="user-input" placeholder="Nombre">
        <input type="password" id="pin-input" placeholder="PIN Oficial">
        <button class="main-btn" onclick="verificar()">ACCEDER</button>
    </div>
</div>

<div class="header">
    <span style="font-weight: bold; font-size: 0.9rem;">CENTRAL DATOS</span>
    <div class="menu-btns">
        <button class="btn btn-full" onclick="abrirFull()">✎ EDITAR</button>
        <a href="https://banco-oimc-h47hsdjbghr7jq3thguvva.streamlit.app" target="_blank" class="btn btn-banco">🏦 BANCO</a>
        <button class="btn btn-logout" onclick="cerrarSesion()">✖ SALIR</button>
    </div>
</div>

<div id="doc-container">
    <iframe src="" id="google-doc-frame"></iframe>
</div>

<script>
    const usuarios = { 
        "juan": "2313", "iñaki": "1010", "asier": "2020", "amets": "4040", 
        "erika": "5050", "nahia": "6060", "gaizka": "7070", "mikel": "8080", 
        "yolanda": "9090", "jesús": "1365" 
    };

    // VARIABLE PARA TU LINK
    const miDocUrl = "https://docs.google.com/document/d/1i8r9ZUgGe-1zr-Fyq9SxXcKAnsyOPhRaN3Tc7rJKjLw/edit?usp=sharing"; 

    function verificar() {
        const u = document.getElementById('user-input').value.toLowerCase().trim();
        const p = document.getElementById('pin-input').value.trim();

        if (usuarios[u] === p) {
            document.getElementById('google-doc-frame').src = miDocUrl;
            document.getElementById('login-overlay').style.display = 'none';
        } else {
            alert("Acceso Denegado");
        }
    }

    function cerrarSesion() {
        // Limpia el iframe y vuelve a mostrar el login
        document.getElementById('google-doc-frame').src = "";
        document.getElementById('user-input').value = "";
        document.getElementById('pin-input').value = "";
        document.getElementById('login-overlay').style.display = 'flex';
    }

    function abrirFull() {
        // Esto ayuda a que en móviles se abra el teclado perfectamente
        window.open(miDocUrl, '_blank');
    }
</script>

</body>
</html>
