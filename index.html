<script>
    // --- URL DE LA NUBE ---
    const CLOUD_URL = "https://kvdb.io/6E9C9U8v5F8u8L9Y9xZ7j9/noticias_jaso_oimc";

    let tempImageData = null;
    const usersDB = { "juan": "2313", "iñaki": "1010", "asier": "2020", "amets": "4040", "erika": "5050", "nahia": "6060", "gaizka": "7070", "mikel": "8080", "yolanda": "9090", "jesús": "1365" };

    // Captura de Ctrl+V
    document.addEventListener('paste', e => {
        const item = e.clipboardData.items[0];
        if (item && item.type.indexOf('image') !== -1) {
            const reader = new FileReader();
            reader.onload = event => {
                tempImageData = event.target.result;
                document.getElementById('image-preview').innerHTML = `<img src="${tempImageData}" style="height:100px;">`;
            };
            reader.readAsDataURL(item.getAsFile());
        }
    });

    function checkLogin() {
        const u = document.getElementById('user-input').value.toLowerCase().trim();
        const p = document.getElementById('pass-input').value.trim();
        if (usersDB[u] === p) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('nav-bar').style.display = 'flex';
            if (u === 'juan') document.getElementById('admin-tab-btn').style.display = 'block';
            loadNews(); // Carga inicial
        } else { alert("PIN incorrecto"); }
    }

    async function loadNews() {
        try {
            const res = await fetch(CLOUD_URL);
            const history = await res.json();
            render(history);
        } catch (e) { render([]); }
    }

    async function saveNews() {
        const t = document.getElementById('news-title').value;
        const b = document.getElementById('news-body').value;
        const btn = document.querySelector('button[onclick="saveNews()"]');
        
        if(!t || !b) return alert("Faltan datos");

        btn.innerText = "PUBLICANDO...";
        btn.disabled = true;

        let history = [];
        try {
            const res = await fetch(CLOUD_URL);
            history = await res.json();
        } catch(e) {}

        history.unshift({ id: Date.now(), title: t, body: b, image: tempImageData, date: new Date().toLocaleString() });

        try {
            await fetch(CLOUD_URL, { method: 'POST', body: JSON.stringify(history) });
            
            // LIMPIEZA SIN RECARGAR PÁGINA
            document.getElementById('news-title').value = "";
            document.getElementById('news-body').value = "";
            tempImageData = null;
            document.getElementById('image-preview').innerHTML = "Pega imagen (Ctrl+V)";
            
            alert("¡Comunicado oficial Jaso-O.I.M.C. publicado!");
            
            await loadNews(); // Actualiza la lista visualmente
            openTab('tab-ver', document.querySelectorAll('.tab-btn')[1]); // Te lleva a ver la noticia
        } catch (e) {
            alert("Error de conexión con la nube");
        } finally {
            btn.innerText = "PUBLICAR PARA TODOS";
            btn.disabled = false;
        }
    }

    async function deleteNews(id) {
        if(!confirm("¿Eliminar este registro?")) return;
        try {
            const res = await fetch(CLOUD_URL);
            let history = await res.json();
            history = history.filter(n => n.id !== id);
            await fetch(CLOUD_URL, { method: 'POST', body: JSON.stringify(history) });
            await loadNews(); // Actualiza la lista sin reiniciar
        } catch(e) { alert("Error al borrar"); }
    }

    function render(history) {
        const feed = document.getElementById('news-feed');
        const admin = document.getElementById('admin-news-list');
        
        feed.innerHTML = history.map(n => `
            <div class="news-item">
                <small>${n.date}</small>
                <h3>${n.title}</h3>
                <p>${n.body.replace(/\n/g, '<br>')}</p>
                ${n.image ? `<img src="${n.image}" class="news-img">` : ''}
            </div>
        `).join('') || "No hay noticias globales todavía.";

        admin.innerHTML = history.map(n => `
            <div class="news-item" style="border-left-color: #27ae60;">
                <small>${n.date}</small>
                <h3>${n.title}</h3>
                <button class="btn-delete" onclick="deleteNews(${n.id})">BORRAR DE LA NUBE</button>
            </div>
        `).join('');
    }

    function openTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }
</script>
